<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniHarness</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #161a22;
        --border: #262c38;
        --text: #d7dce4;
        --muted: #8a93a5;
        --accent: #4f8cff;
        --danger: #e5534b;
        --ok: #3fb950;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
      }
      #root { height: 100vh; display: flex; flex-direction: column; }
      .app { display: flex; flex: 1; min-height: 0; }
      .sidebar {
        width: 260px; background: var(--panel); border-right: 1px solid var(--border);
        display: flex; flex-direction: column; padding: 12px; gap: 8px; overflow-y: auto;
      }
      .sidebar h2 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin: 8px 4px 4px; }
      .session-item {
        padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
        border: 1px solid transparent;
      }
      .session-item:hover { background: #1d2330; }
      .session-item.active { background: #1d2330; border-color: var(--accent); }
      .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .statusbar {
        height: 28px; display: flex; align-items: center; gap: 12px; padding: 0 12px;
        background: var(--panel); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
      .dot.connected { background: var(--ok); }
      .dot.disconnected { background: var(--danger); }
      .messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
      .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
      .msg.user { align-self: flex-end; background: #22314f; }
      .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
      .msg.tool { align-self: flex-start; background: #131720; border: 1px solid var(--border); font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
      .composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
      .composer textarea {
        flex: 1; resize: none; height: 44px; background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 14px; font-family: inherit;
      }
      .composer button {
        background: var(--accent); color: white; border: none; border-radius: 8px;
        padding: 0 20px; font-size: 14px; cursor: pointer;
      }
      .composer button:disabled { opacity: 0.4; cursor: default; }
      .empty { color: var(--muted); text-align: center; margin-top: 30vh; font-size: 14px; }
      .approval {
        border: 1px solid var(--danger); border-radius: 8px; padding: 10px 14px;
        background: #22161a; font-size: 13px; display: flex; align-items: center; gap: 12px;
      }
      .approval button { padding: 4px 14px; border-radius: 6px; border: none; cursor: pointer; }
      .approval .approve { background: var(--ok); color: #04140a; }
      .approval .deny { background: var(--danger); color: white; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
