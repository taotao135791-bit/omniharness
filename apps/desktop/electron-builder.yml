appId: dev.omniharness.desktop
productName: OmniHarness
copyright: Copyright © 2026 OmniHarness Contributors
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**
  - renderer/**
  - package.json
extraResources:
  - from: ../../release/omniharness-0.1.0/bin
    to: bin
    filter:
      - omniharnessd
      - omni
mac:
  icon: ../../brand/assets/icon.icns
  category: public.app-category.developer-tools
  target: [dmg, zip]
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  icon: ../../brand/assets/icon.png
  target: [nsis, zip]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: ../../brand/assets/icon.png
  target: [AppImage, deb]
  category: Development
electronDownload:
  cache: ~/.cache/electron
